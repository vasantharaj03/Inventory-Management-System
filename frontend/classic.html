<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IntelliStock – Inventory</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F8;--side:#FFFFFFcc;--card:#fff;--soft:#F4F5FB;--ink:#0F1222;--mute:#6B7280;--line:#E8EAF0;--blue:#5B5BF5;--grad:linear-gradient(135deg,#4F5BF0,#8A5CF6);--green:#12915F;--gbg:#DCF5E9;--red:#D93F3F;--rbg:#FDE6E6;--amber:#B97800;--abg:#FFF0C7;--sh:0 1px 2px #10182808,0 10px 30px -14px #1018281f}
[data-theme=dark]{--bg:#0D0F17;--side:#121521cc;--card:#161A27;--soft:#1D2231;--ink:#EEF0F8;--mute:#8E94AA;--line:#252A3B;--green:#3DD598;--gbg:#12332A;--red:#FF6B6B;--rbg:#3A1C22;--amber:#F5B93B;--abg:#3A2E12;--sh:0 1px 2px #0006,0 10px 30px -14px #000a}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
aside{width:264px;background:var(--side);backdrop-filter:blur(16px);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:800;letter-spacing:-.5px;margin:0 6px 24px}.logo i{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px -6px #5B5BF5aa}
.me{display:flex;gap:11px;align-items:center;padding:12px;margin-bottom:16px;background:var(--soft);border-radius:14px}.av{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:700;color:#fff}.me small{color:var(--mute);display:block;font-size:12px}
nav button,.foot button{display:flex;gap:12px;width:100%;align-items:center;background:none;border:0;padding:10px 12px;border-radius:11px;font:inherit;font-weight:500;color:var(--mute);cursor:pointer;margin-bottom:3px;transition:.15s;text-align:left}
nav button:hover,.foot button:hover{background:var(--soft);color:var(--ink)}nav button.on{background:var(--grad);color:#fff;font-weight:600;box-shadow:0 8px 18px -8px #5B5BF5cc}
.foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
main{flex:1;padding:28px 34px;min-width:0;max-width:1520px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.8px}.sub{color:var(--mute);margin:2px 0 0}
.hb{display:flex;gap:10px;align-items:center}.search{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 14px;width:min(320px,60vw);font:inherit}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:#fff;border:0;padding:10px 16px;border-radius:11px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 8px 18px -10px #5B5BF5;transition:.15s}.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}.btn.soft{background:var(--soft);color:var(--ink);width:100%;justify-content:center;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.grid{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:1fr 1.7fr 1.2fr}.g2{grid-template-columns:1fr 1fr}.g32{grid-template-columns:1.3fr 1fr}
.card{background:var(--card);border-radius:18px;padding:22px;border:1px solid var(--line);box-shadow:var(--sh);min-width:0}.card h3{margin:0 0 14px;font-size:18px;font-weight:700;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:center}
.card h3 a{color:var(--blue);font-size:13px;font-weight:600;cursor:pointer}
.kpi small{color:var(--mute);display:block;margin-bottom:6px;font-weight:500}.kpi b{font-size:30px;font-weight:800;letter-spacing:-1px}.kpi em{font-style:normal;color:var(--mute);margin-left:6px;font-size:13px}
.kpi.hero{background:radial-gradient(120% 140% at 100% 0,#ffffff30,#0000 55%),var(--grad);color:#fff;border:0}.kpi.hero small,.kpi.hero em{color:#E6E9FF}
.stat{margin-bottom:22px}.stat small{color:var(--mute);display:block}.stat b{font-size:32px;font-weight:700;letter-spacing:-1px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;margin-left:8px}.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{background:var(--gbg);color:var(--green)}.low{background:var(--abg);color:var(--amber)}.out{background:var(--rbg);color:var(--red)}
.bars{display:flex;gap:16px;align-items:flex-end;height:190px}.bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-left:1px dashed var(--line);padding-left:10px;height:100%}.bcol span{font-size:24px;font-weight:700;margin-bottom:auto}.bcol i{border-radius:12px;display:block}
.bl{display:flex;gap:16px}.bl small{flex:1;color:var(--mute);padding-left:10px}
.ins{display:flex;gap:12px;overflow-x:auto}.ins div{min-width:170px;flex:1;background:var(--soft);border-radius:14px;padding:14px}.ins b{display:block;font-size:15px}.ins small{color:var(--mute)}
.tile{width:100%;height:110px;border-radius:14px;display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff;margin-bottom:10px}
.prog{background:var(--soft);border-radius:12px;height:52px;overflow:hidden;position:relative;margin-top:12px}.prog i{display:flex;align-items:center;padding-left:14px;height:100%;color:#fff;font-size:20px;font-weight:700;min-width:64px}.prog small{position:absolute;right:14px;top:16px;color:var(--mute)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0}.li .th{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}.li div:nth-child(2){flex:1}.li small{color:var(--mute)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mute);font-weight:500;font-size:13px;padding:10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}tbody tr:hover td,table tr:hover td{background:var(--soft)}.r{text-align:right}.scroll{overflow-x:auto}
.donut{width:110px;height:110px;border-radius:50%;position:relative;flex-shrink:0}.donut:after{content:"";position:absolute;inset:26%;background:var(--card);border-radius:50%}
.row{display:flex;align-items:center;gap:16px}.lg div{display:flex;justify-content:space-between;gap:14px;margin:4px 0}.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}.items .card{padding:12px;transition:.2s}.items .card:hover{transform:translateY(-3px)}.items .tile{position:relative;height:130px}
.badge{position:absolute;top:10px;left:10px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;color:#fff}.badge.ok{background:#1E9E4F}.badge.low{background:#F25555}.badge.out{background:#6B7280}
.qv{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:10px 0}.qv div{display:flex;justify-content:space-between;padding:4px 0}.qv div+div{border-top:1px solid var(--line)}.qv span{color:var(--mute)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}input,select{padding:10px 12px;border:1px solid var(--line);border-radius:11px;font:inherit;background:var(--card);color:var(--ink);width:100%}.tools input{max-width:300px;width:auto;flex:1}.tools select{width:auto}
.skuL{color:var(--blue);font-weight:600}.sm2{display:flex;gap:6px;align-items:center;color:var(--mute)}
.hb2{display:flex;align-items:center;gap:12px;margin:12px 0}.hb2 span:first-child{width:110px;color:var(--mute)}.hb2 .t{flex:1;height:16px;border-radius:9px;background:var(--soft);overflow:hidden}.hb2 .t i{display:block;height:100%;background:var(--grad);border-radius:9px}.hb2 span:last-child{width:44px;text-align:right;color:var(--mute)}
.stk{border:1px solid var(--line);border-radius:14px;padding:16px}.stk b{font-size:38px;font-weight:700;display:block}.stk i{display:block;height:6px;border-radius:3px;margin-top:10px;background:var(--soft)}.stk i u{display:block;height:100%;border-radius:3px}
dialog{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:26px;width:min(460px,92vw);box-shadow:0 30px 80px -20px #0008}dialog[open]{animation:pop .18s ease}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
dialog::backdrop{background:#0a0d1a88;backdrop-filter:blur(4px)}dialog label,#login label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px}.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ol{display:grid;grid-template-columns:1fr 84px 38px;gap:8px;margin-bottom:8px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.err{color:var(--red);margin-top:10px;min-height:18px}.empty{color:var(--mute);padding:18px 0;text-align:center}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;font-weight:600}.toast.show{opacity:1}
body.user .adm{display:none!important}body.out aside,body.out main{display:none}#login{display:none;position:fixed;inset:0;background:radial-gradient(60% 50% at 20% 10%,#5B5BF533,#0000),var(--bg);place-items:center;z-index:20;padding:16px}body.out #login{display:grid}#login .card{width:min(410px,100%);padding:32px}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin:20px 0}.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}.tabs button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 4px #0002}.hint{color:var(--mute);font-size:12px;margin-top:14px}
@media(max-width:1100px){.g3,.g32,.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.me{display:none}.logo{margin:0 10px 0 0}nav{display:flex}nav button{width:auto;white-space:nowrap;margin:0}.foot{display:flex;margin:0;border:0;padding:0}.foot button{width:auto;white-space:nowrap}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

[data-theme=dark]{--bg:#060A13;--side:#090E1Bdd;--card:#0E1424;--soft:#141C31;--line:#1F2945;--ink:#E8ECF8;--mute:#8993B1;--blue:#4C8DFF;--grad:linear-gradient(135deg,#3B82F6,#8B5CF6)}
[data-theme=dark] body{background:radial-gradient(900px 500px at 12% -10%,#1B3A8A55,#0000),radial-gradient(800px 500px at 100% 5%,#6D28D93a,#0000),linear-gradient(#ffffff07 1px,#0000 1px) 0 0/46px 46px,linear-gradient(90deg,#ffffff07 1px,#0000 1px) 0 0/46px 46px,var(--bg);background-attachment:fixed}
[data-theme=dark] .card{background:linear-gradient(160deg,#121A2E,#0B1020);border-color:#26304D;box-shadow:inset 0 1px 0 #ffffff10,0 22px 40px -26px #000}
[data-theme=dark] nav button.on{background:#12234A;box-shadow:0 0 0 1px #3B82F6,0 0 24px -4px #3B82F6bb}
[data-theme=dark] .btn{box-shadow:0 0 18px -4px #5B7CFA}
.bz{position:relative;overflow:hidden;min-height:128px}.bz:before{content:"";position:absolute;inset:0;background:radial-gradient(90% 130% at 15% 0,var(--g),#0000 70%);opacity:.35;pointer-events:none}.bz>*{position:relative}
[data-theme=dark] .bz{opacity:1;border:1px solid #5A6584;box-shadow:inset 0 0 0 3px #0B1020,inset 0 0 0 4px #3A4462,0 0 30px -10px var(--g)}[data-theme=dark] .bz:before{opacity:1}
.arrow{position:absolute!important;right:14px;top:14px;width:26px;height:26px;border-radius:8px;border:1px solid #ffffff30;display:grid;place-items:center;color:var(--mute)}
.spk{position:absolute!important;right:16px;bottom:14px;width:120px;height:36px;filter:drop-shadow(0 0 6px #fff6)}
.ringw{position:relative;width:128px;height:128px;flex-shrink:0}.ringw.sm{width:88px;height:88px}.ringw svg{width:100%;height:100%;filter:drop-shadow(0 0 7px #4C8DFF88)}.trk{fill:none;stroke:var(--line);stroke-width:7}.ringw .v{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:18px}
.rads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;align-items:end}.rad{text-align:center}.rad svg{width:100%;max-width:130px;filter:drop-shadow(0 0 10px currentColor)}.hx{fill:none;stroke:var(--line);stroke-width:1.2}.mu{color:var(--mute);display:block}.rn{display:block;font-size:26px;font-weight:700}
.pi{width:54px;height:54px;border-radius:12px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font-size:28px;flex-shrink:0}.pi img{width:100%;height:100%;object-fit:cover}.pi.s{width:40px;height:40px;font-size:20px;border-radius:10px}
.tile .pi{width:100%;height:100%;background:none;font-size:58px;border-radius:14px}.nm{display:flex;gap:12px;align-items:center}
.rs{min-width:190px;flex:1;background:var(--soft);border-radius:14px;padding:14px}.rs b{display:block;font-size:15px}.rs small{color:var(--mute)}.rs .btn{margin-top:8px}
.prog.sm{height:8px;margin:4px 0 0}.prog.sm i{min-width:0;padding:0}

.items{grid-template-columns:repeat(auto-fill,minmax(255px,1fr));align-items:stretch}.items .card.pc{display:flex;flex-direction:column;padding:14px;transition:.2s}.pc:hover{transform:translateY(-4px);box-shadow:0 24px 40px -22px #5B5BF588}
.items .tile{height:175px;margin:0;overflow:hidden}.pi img,.pi svg{transition:.35s}.pc:hover .pi img,.pc:hover .pi svg{transform:scale(1.07)}.pi svg{width:78%;height:78%}.tile .pi svg{width:66%;height:66%}.tile .pi img{object-fit:contain;padding:10px;background:#fff}
.cam{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:11px;border:0;background:#000a;color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:.2s}.pc:hover .cam{opacity:1}@media(hover:none){.cam{opacity:1}}
.meta{margin:14px 0 10px}.meta small{color:var(--mute);display:block}.meta b{font-size:16px;display:block;margin:2px 0 4px}.pr{font-weight:800;color:var(--blue);font-size:17px}.pr small{display:inline;color:var(--mute);font-weight:400;font-size:12px}
.gauge{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.gauge i{display:block;height:100%;border-radius:3px}.pc .qv{margin:12px 0 4px}.pbtn{display:flex;gap:8px;margin-top:auto;padding-top:12px}.pbtn .btn.soft{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}.ch{border:1px solid var(--line);background:var(--card);color:var(--mute);padding:8px 14px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}.ch b{margin-left:6px;color:var(--ink)}.ch.on{background:var(--grad);color:#fff;border-color:transparent}.ch.on b{color:#fff}
.pv{height:150px;border-radius:14px;background:var(--soft);display:grid;place-items:center;overflow:hidden}.pv .pi{width:100%;height:100%;background:none;font-size:60px;border-radius:0}.pv .pi img{object-fit:contain;padding:8px;background:#fff}.hint a{color:var(--blue);font-weight:600}
</style></head><body>
<aside><div class="logo"><i></i>IntelliStock</div><div class="me"><div class="av" id="mav"></div><div><b id="mn"></b><small id="mr"></small></div></div>
<nav id="nav"></nav>
<div class="foot"></div></aside>
<main id="app"></main>
<dialog id="pdlg"><form id="pform" method="dialog"><h2 id="ptitle" style="font-size:22px">Add product</h2>
<label>Name</label><input name="name" required><div class="fr"><div><label>SKU</label><input name="sku" required></div><div><label>Unit price</label><input name="unit_price" type="number" step="0.01" min="0" required></div></div>
<div class="fr"><div><label>Category</label><select name="category_id" id="catSel"></select></div><div><label>Supplier</label><select name="supplier_id" id="supSel"></select></div></div>
<div class="fr"><div><label>Opening stock</label><input name="quantity" type="number" min="0" value="0"></div><div><label>Reorder level</label><input name="reorder_level" type="number" min="0" value="10"></div></div>
<label>Product image (optional)</label><input type="file" id="pimg" accept="image/*"><div class="err" id="perr"></div><div class="actions"><button type="button" class="btn ghost" data-close="pdlg">Cancel</button><button class="btn">Save product</button></div></form></dialog>
<dialog id="mdlg"><form id="mform" method="dialog"><h2 id="mtitle" style="font-size:22px">Update stock</h2>
<label>Action</label><select name="type"><option value="IN">Receive stock (add)</option><option value="OUT">Ship stock (remove)</option><option value="ADJUST">Set exact count</option></select>
<label>Quantity</label><input name="quantity" type="number" min="0" required><label>Note</label><input name="note" placeholder="e.g. Order #1080">
<div class="err" id="merr"></div><div class="actions"><button type="button" class="btn ghost" data-close="mdlg">Cancel</button><button class="btn">Update stock</button></div></form></dialog>
<dialog id="odlg"><form id="oform" method="dialog"><h2 id="otitle" style="font-size:22px;margin:0"></h2><label id="oplab">Party</label><select id="oparty"></select><div><label>Channel</label><select id="ochan"><option>Direct</option><option>Online</option><option>Retail</option><option>Wholesale</option></select></div>
<label>Items</label><div id="olines"></div><button type="button" class="btn ghost sm" onclick="addLine()">+ Add item</button><p style="font-size:18px;font-weight:700;margin:14px 0 0">Total <span id="ototal"></span></p><div class="err" id="oerr"></div><div class="actions"><button type="button" class="btn ghost" data-close="odlg">Cancel</button><button class="btn">Create order</button></div></form></dialog>
<dialog id="pwdlg"><form id="pwform" method="dialog"><h2 style="font-size:22px;margin:0">Change password</h2><label>Current password</label><input id="pwo" type="password" required><label>New password (min 6)</label><input id="pwn" type="password" minlength="6" required><div class="err" id="pwerr"></div><div class="actions"><button type="button" class="btn ghost" data-close="pwdlg">Cancel</button><button class="btn">Update password</button></div></form></dialog>
<dialog id="imgdlg"><form id="imgform" method="dialog"><h2 style="font-size:22px;margin:0 0 12px">Product photo</h2><div class="pv" id="imgpv"></div><label>Upload a photo</label><input type="file" id="ifile" accept="image/*"><label>…or paste an image link</label><input id="iurl" placeholder="https://example.com/photo.jpg"><p class="hint"><a id="ifind" target="_blank" rel="noopener">Find a photo on Google Images ↗</a></p><div class="err" id="ierr"></div><div class="actions"><button type="button" class="btn ghost" onclick="saveImg('')">Remove</button><button type="button" class="btn ghost" data-close="imgdlg">Cancel</button><button class="btn">Save photo</button></div></form></dialog>
<div id="login"><form class="card" id="lform"><div class="logo" style="margin:0"><i></i>IntelliStock</div><div class="tabs"><button type="button" class="on" data-r="admin">Admin sign-in</button><button type="button" data-r="user">User sign-in</button></div>
<label>Email</label><input id="le" type="email" required autocomplete="username"><label>Password</label><input id="lp" type="password" required autocomplete="current-password">
<div class="err" id="lerr"></div><button class="btn" style="width:100%;margin-top:6px">Sign in</button><p class="hint" id="lhint"></p></form></div>
<div class="toast" id="toast"></div>
<script>
const CUR='INR',money=n=>new Intl.NumberFormat(undefined,{style:'currency',currency:CUR,maximumFractionDigits:0}).format(n||0),num=n=>new Intl.NumberFormat().format(n||0);
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(u,o={})=>{const r=await fetch('/api'+u,{...o,headers:{'Content-Type':'application/json',...(TOKEN?{Authorization:'Bearer '+TOKEN}:{})},body:o.body?JSON.stringify(o.body):undefined});if(r.status===401&&TOKEN){logout();throw new Error('Session expired')}if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(typeof e.detail==='string'?e.detail:'Check the form values and try again')}return r.json()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
let view='dashboard',cats=[],sups=[],editId=null,moveId=null,filt={q:'',cat:'',low:false},PL=[];
const COL=['#4C63F0','#1E9E4F','#E2A400','#B57EDC','#D6403F'],tc=p=>COL[(p.category_id||p.id||0)%5];
const st=p=>p.quantity===0?['Out of stock','out']:p.quantity<=p.reorder_level?['Low stock','low']:['In stock','ok'];
const donut=(v,c)=>{const t=v.reduce((a,b)=>a+Number(b),0)||1;let a=0;return `<div class="donut" style="background:${t===1&&!v.some(x=>x)?'#EEE':`conic-gradient(${v.map((x,i)=>{const s=a;a+=x/t*100;return `${c[i]} ${s}% ${a}%`}).join(',')})`}"></div>`};

 <div class="grid g3"><div class="card"><h3>Overview</h3><div class="row" style="justify-content:space-between"><div><div class="stat"><small>Total units in stock</small><b>${num(b.units)}</b></div><div class="stat"><small>Inventory value</small><b>${money(k.value)}</b></div><div class="stat" style="margin:0"><small>Products needing reorder</small><b>${b.low}</b></div></div>${ring([[100*b.high/T,'#22D3EE'],[100*b.near/T,'#A78BFA'],[100*b.low/T,'#F472B6']])}</div></div>

 <div class="card"><h3>Out of stock</h3><div class="row" style="justify-content:space-between"><div class="stat" style="margin:0"><b>${k.out_of_stock}</b><span class="chip out">needs action</span></div>${ring([[oo,'#F87171']],oo+'%','sm')}</div><div class="prog"><i style="width:${oo}%;background:#EF4444">${oo}%</i><small>All products</small></div></div></div>

 <div class="card"><h3>Top selling items <a onclick="go('items')">View products</a></h3>${d.top.length?d.top.map(p=>{const x=st(p);return `<div class="li">${pic(p)}<div><b>${esc(p.name)}</b><br><small>${p.sold} sold</small></div><span class="chip ${x[1]}">${x[0]} – ${p.quantity}</span></div>`}).join(''):'<div class="empty">No sales in the last 30 days.</div>'}</div></div>

 $('#nav').innerHTML=NAV.filter(n=>!n[3]||(ME&&ME.role==='admin')).map(n=>`<button data-v="${n[0]}" class="${n[0]===view?'on':''}">${ic(n[1])}${n[2]}</button>`).join('');
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
 $('.foot').innerHTML=`<button onclick="toggleTheme()">${ic(TH==='dark'?'sun':'moon')}${TH==='dark'?'Light mode':'Dark mode'}</button><button onclick="openPw()">${ic('key')}Change password</button><button onclick="logout()">${ic('logout')}Log out</button>`}
function toggleTheme(){TH=TH==='dark'?'light':'dark';localStorage.setItem('stk_th',TH);document.documentElement.dataset.theme=TH;renderNav()}
const chipC={confirmed:'ok',received:'ok',ordered:'low',cancelled:'out'};
const fd=d=>new Date(d).toLocaleDateString();
async function sales(){const o=await api('/sales-orders');
 $('#app').innerHTML=hdr('Sales orders','Every sale reduces stock automatically.',`<button class="btn" onclick="openOrder('sales')">${ic('plus')}New sale</button>`)+`<div class="card scroll">${o.length?`<table><tr><th>Order</th><th>Date</th><th>Customer</th><th>Channel</th><th class="r">Units</th><th class="r">Total</th><th>Status</th><th></th></tr>${o.map(x=>`<tr><td><b>#${x.id}</b></td><td>${fd(x.created_at)}</td><td>${esc(x.customer)}</td><td>${esc(x.channel)}</td><td class="r">${x.units}</td><td class="r"><b>${money(x.total)}</b></td><td><span class="chip ${chipC[x.status]}" style="margin:0">${x.status}</span></td><td class="r">${x.status==='confirmed'?`<button class="btn sm ghost adm" onclick="cancelSale(${x.id})">Cancel</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">No sales yet. Create the first order.</div>'}</div>`;bind()}
async function purchases(){const o=await api('/purchase-orders');
 $('#app').innerHTML=hdr('Purchase orders','Receiving an order adds its items to stock.',`<button class="btn adm" onclick="openOrder('purchase')">${ic('plus')}New purchase order</button>`)+`<div class="card scroll">${o.length?`<table><tr><th>Order</th><th>Date</th><th>Supplier</th><th class="r">Units</th><th class="r">Total</th><th>Status</th><th></th></tr>${o.map(x=>`<tr><td><b>PO-${x.id}</b></td><td>${fd(x.created_at)}</td><td>${esc(x.supplier)}</td><td class="r">${x.units}</td><td class="r"><b>${money(x.total)}</b></td><td><span class="chip ${chipC[x.status]}" style="margin:0">${x.status}</span></td><td class="r">${x.status==='ordered'?`<button class="btn sm" onclick="recv(${x.id})">Mark received</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">No purchase orders yet.</div>'}</div>`;bind()}
async function contacts(){const [c,sp]=await Promise.all([api('/customers'),api('/suppliers')]);
 const tbl=a=>a.length?`<table><tr><th>Name</th><th>Email</th><th>Phone</th></tr>${a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.email||'–')}</td><td>${esc(x.phone||'–')}</td></tr>`).join('')}</table>`:'<div class="empty">None yet.</div>';
 const frm=(k,cls)=>`<div class="tools ${cls}"><input id="${k}n" placeholder="Name"><input id="${k}e" placeholder="Email"><input id="${k}p" placeholder="Phone"><button class="btn" id="${k}a">Add</button></div>`;
 $('#app').innerHTML=hdr('Customers & suppliers','People you sell to and buy from.')+`<div class="grid g2"><div class="card"><h3>Customers</h3>${frm('c','')}<div class="err" id="cerr"></div><div class="scroll">${tbl(c)}</div></div><div class="card"><h3>Suppliers</h3>${frm('s','adm')}<div class="err" id="serr"></div><div class="scroll">${tbl(sp)}</div></div></div>`;
 const add=(k,u)=>$('#'+k+'a').onclick=async()=>{try{await api(u,{method:'POST',body:{name:$('#'+k+'n').value,email:$('#'+k+'e').value||null,phone:$('#'+k+'p').value||null}});toast('Saved');contacts()}catch(x){$('#'+k+'err').textContent=x.message}};add('c','/customers');add('s','/suppliers');bind()}
async function audit(){const a=await api('/audit');
 $('#app').innerHTML=hdr('Audit log','Every change made in the system, newest first.')+`<div class="card scroll"><table><tr><th>When</th><th>User</th><th>Action</th></tr>${a.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td><b>${esc(x.user_name)}</b></td><td>${esc(x.action)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No changes recorded yet.</td></tr>'}</table></div>`;bind()}
let OK='sales',OP=[];
async function openOrder(kind){OK=kind;const [pr,pa]=await Promise.all([api('/products'),api(kind==='sales'?'/customers':'/suppliers')]);OP=pr;
 $('#otitle').textContent=kind==='sales'?'New sales order':'New purchase order';$('#oplab').textContent=kind==='sales'?'Customer':'Supplier';
 $('#oparty').innerHTML=(kind==='sales'?'<option value="">Walk-in customer</option>':'')+pa.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');
 $('#ochan').parentElement.style.display=kind==='sales'?'':'none';$('#olines').innerHTML='';$('#oerr').textContent='';addLine();$('#odlg').showModal()}
function addLine(){const d=document.createElement('div');d.className='ol';d.innerHTML=`<select class="op">${OP.map(p=>`<option value="${p.id}" data-p="${p.unit_price}">${esc(p.name)} (${p.quantity} in stock)</option>`).join('')}</select><input class="oq" type="number" min="1" value="1"><button type="button" class="btn ghost sm" onclick="this.parentElement.remove();tot()">✕</button>`;d.oninput=tot;$('#olines').append(d);tot()}
function tot(){let t=0;document.querySelectorAll('.ol').forEach(l=>{t+=l.querySelector('.op').selectedOptions[0].dataset.p*l.querySelector('.oq').value});$('#ototal').textContent=money(t)}
$('#oform').onsubmit=async e=>{e.preventDefault();const items=[...document.querySelectorAll('.ol')].map(l=>({product_id:+l.querySelector('.op').value,quantity:+l.querySelector('.oq').value}));const pv=$('#oparty').value;
 const body=OK==='sales'?{customer_id:pv?+pv:null,channel:$('#ochan').value,items}:{supplier_id:+pv,items};
 try{await api(OK==='sales'?'/sales-orders':'/purchase-orders',{method:'POST',body});$('#odlg').close();toast('Order created');go(OK==='sales'?'sales':'purchases')}catch(x){$('#oerr').textContent=x.message}};
async function cancelSale(id){if(!confirm('Cancel this order and return its items to stock?'))return;try{await api('/sales-orders/'+id+'/cancel',{method:'POST'});toast('Order cancelled');sales()}catch(x){toast(x.message)}}
async function recv(id){try{await api('/purchase-orders/'+id+'/receive',{method:'POST'});toast('Stock received');purchases()}catch(x){toast(x.message)}}
async function togUser(id){try{await api('/users/'+id+'/toggle',{method:'POST'});users()}catch(x){toast(x.message)}}
function openPw(){$('#pwform').reset();$('#pwerr').textContent='';$('#pwdlg').showModal()}
$('#pwform').onsubmit=async e=>{e.preventDefault();try{await api('/auth/change-password',{method:'POST',body:{old_password:$('#pwo').value,new_password:$('#pwn').value}});$('#pwdlg').close();toast('Password updated')}catch(x){$('#pwerr').textContent=x.message}};
function exportCSV(){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const rows=[['SKU','Name','Category','Supplier','Price','Quantity','Reorder level'],...PL.map(p=>[p.sku,p.name,p.category,p.supplier,p.unit_price,p.quantity,p.reorder_level])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='products.csv';a.click()}

const pic=(p,z='')=>`<span class="pi ${z}">${p.image?`<img src="${p.image}" alt="" loading="lazy">`:`<svg viewBox="0 0 120 120">${ART.find(a=>a[0].test(p.name))[1]}</svg>`}</span>`;
function openImg(id){IMGID=id;const p=PL.find(x=>x.id===id);$('#imgpv').innerHTML=pic(p);$('#ifile').value='';$('#iurl').value=p.image&&p.image.startsWith('http')?p.image:'';$('#ifind').href='https://www.google.com/search?tbm=isch&q='+encodeURIComponent(p.name+' product');$('#ierr').textContent='';$('#imgdlg').showModal()}
async function saveImg(v){try{await api('/products/'+IMGID+'/image',{method:'POST',body:{image:v}});$('#imgdlg').close();toast(v?'Photo saved':'Photo removed');run()}catch(x){$('#ierr').textContent=x.message}}
$('#imgform').onsubmit=async e=>{e.preventDefault();let v=await imgData($('#ifile').files[0]||null);if(!v)v=$('#iurl').value.trim();if(!v){$('#ierr').textContent='Choose a file or paste an image link';return}saveImg(v)};
const spark=(a,c)=>{const m=Math.max(...a,1),pts=a.map((v,i)=>`${(i*120/(a.length-1)).toFixed(1)},${(32-v/m*26).toFixed(1)}`).join(' ');return `<svg class="spk" viewBox="0 0 120 36"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const ring=(g,c='',z='')=>`<div class="ringw ${z}"><svg viewBox="0 0 120 120">${g.map((x,i)=>{const r=52-i*12,C=2*Math.PI*r;return `<circle cx="60" cy="60" r="${r}" class="trk"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${x[1]}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(x[0]?Math.max(x[0],2):0)/100*C} ${C}" transform="rotate(-90 60 60)"/>`}).join('')}</svg>${c?`<span class="v">${c}</span>`:''}</div>`;
const radar=(n,mx,c)=>{const k=mx?n/mx:0,m=[1,.82,.95,.78,1,.86],P=(r,i)=>`${(60+r*Math.cos(i*Math.PI/3-Math.PI/2)).toFixed(1)},${(60+r*Math.sin(i*Math.PI/3-Math.PI/2)).toFixed(1)}`,I=[0,1,2,3,4,5];return `<div class="rad" style="color:${c}"><svg viewBox="0 0 120 120"><polygon class="hx" points="${I.map(i=>P(52,i)).join(' ')}"/><polygon class="hx" points="${I.map(i=>P(26,i)).join(' ')}"/><polygon points="${I.map(i=>P(52*(.15+.85*k)*m[i],i)).join(' ')}" fill="${c}" fill-opacity=".3" stroke="${c}" stroke-width="2"/></svg></div>`};
function imgData(f=$('#pimg').files[0]){return new Promise(res=>{if(!f)return res(null);const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=URL.createObjectURL(f)})}
